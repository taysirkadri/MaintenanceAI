name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-mvp.txt pytest
      - name: Run demo training
        run: python -m cmapss_mvp.cli train --demo
      - name: Run tests
        run: pytest tests/mvp/test_mvp.py -q
